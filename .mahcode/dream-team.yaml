# dream-team — which models are used in THIS project. The manager reads the file before every
# lead launch; edits take effect from the next pair. Model ids — as in mahcode (get_models):
#   wirellm/<model>            — WireLLM (native, mahcode MCP always available)
#   codex/<slug>[#effort]      — Codex CLI      (effort: low | medium | high | xhigh)
#   claude-code/<opus|sonnet|haiku>
#   antigravity/<model>        — agy
#   opencode-go/<model>        — opencode
# The manager and leads need mahcode MCP: wirellm — always; codex/claude/agy — if
# mahcode is registered in their config (the installer offers it).

manager: codex/gpt-6-luna#high        # manager: talks to you/CTO, decides between pairs
leads:   codex/gpt-6-luna#medium      # pair leads: run the doer ⇄ critic loop

roles:
  planner:  codex/gpt-6-luna#high
  critic:   codex/gpt-6-luna#xhigh
  coder:    codex/gpt-6-luna#xhigh
  reviewer: codex/gpt-6-luna#high
  tester:   wirellm/main
  debugger: codex/gpt-6-luna#high

limits:
  max_pair_iters: 5        # doer ⇄ critic iterations in a pair before blocked
  max_test_rounds: 3       # test → bugfix rounds before blocked
  session_ttl: 86400       # seconds of inactivity after which mahcode deletes lead/role sessions
  wait_timeout: 60         # seconds per wait_for_session (≤ 60: engines cut an MCP call after 300 s), repeated until the turn ends
